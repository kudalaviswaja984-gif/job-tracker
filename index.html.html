<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viswaja — Job Application Tracker</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --blue: #1F4E79; --blue-light: #E6F1FB; --blue-mid: #185FA5;
    --text: #1a1a1a; --text-sec: #666; --text-hint: #999;
    --bg: #f8f8f6; --surface: #ffffff; --border: rgba(0,0,0,0.1);
    --green-bg: #EAF3DE; --green-text: #3B6D11;
    --amber-bg: #FAEEDA; --amber-text: #854F0B;
    --red-bg: #FCEBEB; --red-text: #A32D2D;
    --info-bg: #E6F1FB; --info-text: #185FA5;
    --radius: 8px; --radius-lg: 12px;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); font-size: 14px; min-height: 100vh; }
  .topbar { background: var(--blue); color: white; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; }
  .topbar-title { font-size: 16px; font-weight: 500; display: flex; align-items: center; gap: 10px; }
  .topbar-sub { font-size: 12px; opacity: 0.7; }
  .main { max-width: 1400px; margin: 0 auto; padding: 24px 20px; }
  .stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat { background: var(--surface); border-radius: var(--radius); border: 0.5px solid var(--border); padding: 14px 16px; }
  .stat-label { font-size: 11px; color: var(--text-sec); margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
  .stat-value { font-size: 26px; font-weight: 500; color: var(--text); }
  .stat-value.danger { color: var(--red-text); }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn { padding: 6px 14px; font-size: 12px; border-radius: 20px; border: 0.5px solid var(--border); background: var(--surface); color: var(--text-sec); cursor: pointer; transition: all 0.15s; }
  .filter-btn:hover { border-color: var(--blue); color: var(--blue); }
  .filter-btn.active { background: var(--info-bg); color: var(--info-text); border-color: var(--blue-mid); }
  .add-btn { padding: 8px 16px; font-size: 13px; border-radius: var(--radius); border: none; background: var(--blue); color: white; cursor: pointer; display: flex; align-items: center; gap: 6px; font-weight: 500; }
  .add-btn:hover { background: var(--blue-mid); }
  .table-card { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); overflow: hidden; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  thead { background: #f4f4f2; }
  th { padding: 10px 14px; text-align: left; font-size: 11px; font-weight: 500; color: var(--text-sec); border-bottom: 0.5px solid var(--border); white-space: nowrap; text-transform: uppercase; letter-spacing: 0.4px; }
  td { padding: 12px 14px; border-bottom: 0.5px solid var(--border); vertical-align: top; }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fafafa; }
  .company-name { font-weight: 500; font-size: 14px; color: var(--text); }
  .role-name { font-size: 12px; color: var(--text-sec); margin-top: 2px; }
  .role-desc { font-size: 11px; color: var(--text-hint); margin-top: 3px; line-height: 1.4; }
  .badge { display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 500; }
  .badge-high { background: var(--green-bg); color: var(--green-text); }
  .badge-medium { background: var(--amber-bg); color: var(--amber-text); }
  .badge-low { background: var(--red-bg); color: var(--red-text); }
  .badge-market { background: var(--info-bg); color: var(--info-text); font-size: 10px; padding: 2px 7px; }
  .status-select { font-size: 12px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 4px 8px; background: var(--surface); color: var(--text); cursor: pointer; width: 100%; }
  .salary-val { font-weight: 500; font-size: 13px; }
  .days-ok { font-size: 12px; color: var(--text-sec); }
  .days-warn { font-size: 12px; color: #E24B4A; font-weight: 500; }
  .follow-up { font-size: 10px; color: #E24B4A; margin-top: 2px; display: flex; align-items: center; gap: 3px; }
  .date-input { font-size: 11px; border: 0.5px solid var(--border); border-radius: 4px; padding: 3px 6px; background: var(--surface); color: var(--text); width: 130px; margin-top: 5px; }
  .notes-input { font-size: 12px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 5px 8px; background: var(--surface); color: var(--text); width: 100%; resize: vertical; font-family: inherit; min-height: 40px; }
  .notes-input:focus, .date-input:focus, .status-select:focus { outline: none; border-color: var(--blue); }
  .del-btn { background: none; border: none; cursor: pointer; color: var(--text-hint); font-size: 16px; padding: 2px; border-radius: 4px; }
  .del-btn:hover { color: var(--red-text); background: var(--red-bg); }
  .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1000; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: var(--surface); border-radius: var(--radius-lg); border: 0.5px solid var(--border); padding: 24px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .modal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; }
  .modal-title { font-size: 16px; font-weight: 500; }
  .close-btn { background: none; border: none; cursor: pointer; font-size: 20px; color: var(--text-sec); }
  .form-group { margin-bottom: 14px; }
  .form-label { font-size: 12px; color: var(--text-sec); margin-bottom: 5px; display: block; font-weight: 500; }
  .form-input { width: 100%; font-size: 13px; border: 0.5px solid var(--border); border-radius: var(--radius); padding: 8px 10px; background: var(--surface); color: var(--text); font-family: inherit; }
  .form-input:focus { outline: none; border-color: var(--blue); }
  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 20px; padding-top: 16px; border-top: 0.5px solid var(--border); }
  .btn-primary { padding: 8px 20px; font-size: 13px; border-radius: var(--radius); border: none; background: var(--blue); color: white; cursor: pointer; font-weight: 500; }
  .btn-primary:hover { background: var(--blue-mid); }
  .btn-cancel { padding: 8px 20px; font-size: 13px; border-radius: var(--radius); border: 0.5px solid var(--border); background: transparent; color: var(--text-sec); cursor: pointer; }
  .empty { padding: 40px; text-align: center; color: var(--text-hint); font-size: 14px; }
  .saved-toast { position: fixed; bottom: 24px; right: 24px; background: var(--blue); color: white; padding: 10px 18px; border-radius: var(--radius); font-size: 13px; display: none; z-index: 9999; }
  .saved-toast.show { display: block; }
  @media (max-width: 768px) { .stats { grid-template-columns: repeat(2, 1fr); } .form-row { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<div class="topbar">
  <div>
    <div class="topbar-title"><i class="ti ti-briefcase"></i> Job Application Tracker — Viswaja Kudala</div>
    <div class="topbar-sub">Auto-saves to browser. Priority calculated from average salary per market.</div>
  </div>
  <div style="font-size:12px;opacity:0.7;" id="last-saved"></div>
</div>

<div class="main">
  <div class="stats" id="stats"></div>
  <div class="toolbar">
    <div class="filters" id="filters">
      <button class="filter-btn active" onclick="setFilter('All',this)">All</button>
      <button class="filter-btn" onclick="setFilter('India',this)">India</button>
      <button class="filter-btn" onclick="setFilter('New Zealand',this)">New Zealand</button>
      <button class="filter-btn" onclick="setFilter('High',this)">High priority</button>
      <button class="filter-btn" onclick="setFilter('No Response',this)">Follow up needed</button>
      <button class="filter-btn" onclick="setFilter('Screening',this)">In screening</button>
      <button class="filter-btn" onclick="setFilter('Interview Scheduled',this)">Interviews</button>
    </div>
    <button class="add-btn" onclick="openModal()"><i class="ti ti-plus"></i> Add application</button>
  </div>
  <div class="table-card">
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th style="width:20%">Company and role</th>
            <th style="width:8%">Market</th>
            <th style="width:9%">Salary</th>
            <th style="width:8%">Priority</th>
            <th style="width:13%">Status</th>
            <th style="width:13%">Last update</th>
            <th style="width:25%">Notes</th>
            <th style="width:4%"></th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="empty" style="display:none">No applications match this filter.</div>
    </div>
  </div>
</div>

<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Add new application</div>
      <button class="close-btn" onclick="closeModal()"><i class="ti ti-x"></i></button>
    </div>
    <div class="form-group">
      <label class="form-label">Company name *</label>
      <input class="form-input" id="f-company" placeholder="e.g. Solenis" />
    </div>
    <div class="form-group">
      <label class="form-label">Job title *</label>
      <input class="form-input" id="f-title" placeholder="e.g. Power BI Developer" />
    </div>
    <div class="form-group">
      <label class="form-label">Job description summary</label>
      <textarea class="form-input" id="f-desc" rows="2" placeholder="Brief summary of the role and key skills"></textarea>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Salary (LPA for India, NZD K for NZ)</label>
        <input class="form-input" id="f-salary" type="number" placeholder="e.g. 14" />
      </div>
      <div class="form-group">
        <label class="form-label">Market</label>
        <select class="form-input" id="f-market">
          <option>India</option>
          <option>New Zealand</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <input class="form-input" id="f-notes" placeholder="e.g. Referral from friend, follow up by Friday" />
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="addJob()">Add application</button>
    </div>
  </div>
</div>

<div class="saved-toast" id="toast">Saved</div>

<script>
const STATUSES = ['Applied','Screening','Interview Scheduled','Offer Received','Rejected','No Response'];
const NO_RESP_DAYS = 7;

const DEFAULT_JOBS = [
  { id:1,  company:'OYO',          title:'Associate Business Analyst',         desc:'Sales and customer analytics, Power BI dashboards, SQL, stakeholder reporting. US shift, Gurgaon.',          salary:14, market:'India',       status:'Applied',   updated:'2026-06-02', notes:'Applied on Naukri. Strong match ~80%.' },
  { id:2,  company:'NetApp',       title:'BI Analyst',                         desc:'Strategy and operations analytics, Excel automation, Power BI, C-suite market sizing.',                      salary:14, market:'India',       status:'Applied',   updated:'2026-05-31', notes:'Match ~50-55%. Stretch role.' },
  { id:3,  company:'Broadridge',   title:'Business Analyst',                   desc:'Requirements gathering, Agile story cards, UAT, capital markets domain, FinTech MBA relevant.',             salary:14, market:'India',       status:'Applied',   updated:'2026-06-01', notes:'Referral pending from friend — follow up!' },
  { id:4,  company:'Maven',        title:'Data Analyst',                       desc:'Complex data analysis, dashboards, data quality, cross-functional collaboration. Chennai.',                  salary:12, market:'India',       status:'Applied',   updated:'2026-05-29', notes:'Chennai based. Posted 3+ weeks ago — may be filled.' },
  { id:5,  company:'Alcon',        title:'Sr. Associate Data Analysis',        desc:'Statistical analysis, data mining, visualization, self-directed projects. Eye care industry.',              salary:14, market:'India',       status:'Applied',   updated:'2026-06-01', notes:'68 applicants. Strong match ~75%.' },
  { id:6,  company:'NeenOpal',     title:'Data Analyst',                       desc:'SQL, Power BI, Azure ETL, client consulting, trend analysis. Remote.',                                      salary:14, market:'India',       status:'Applied',   updated:'2026-06-02', notes:'Remote role. Python gap — honest on CV.' },
  { id:7,  company:'HP',           title:'Digital Web Data Analyst',           desc:'Databricks, SQL, Power BI dashboards, digital data analysis. Adobe/GA4 gap.',                               salary:14, market:'India',       status:'Applied',   updated:'2026-06-02', notes:'KaarTech alumni at HP — reach out on LinkedIn.' },
  { id:8,  company:'Consertus',    title:'Power BI Developer',                 desc:'DAX, Power Query M, star schema, ETL, client consulting, UAT, documentation.',                             salary:14, market:'India',       status:'Applied',   updated:'2026-06-02', notes:'85% match. Strong consulting fit.' },
  { id:9,  company:'Alter Domus',  title:'Report Developer',                   desc:'SQL, Power BI, UAT, user training, documentation, stakeholder liaison. Hyderabad hybrid.',                  salary:14, market:'India',       status:'Applied',   updated:'2026-06-02', notes:'Hyderabad based — great fit. 85% match.' },
  { id:10, company:'Ameriprise',   title:'Data Analyst',                       desc:'Ad hoc analytics, financial modelling, SQL, Power BI, FinTech domain. Gurgaon.',                           salary:14, market:'India',       status:'Applied',   updated:'2026-06-02', notes:'Auckland alumni connection at Ameriprise — reach out.' },
  { id:11, company:'Solenis',      title:'Power BI Business Support Admin',    desc:'Power BI dev, DAX, Power Query M, star schema, RLS, performance optimisation. Hyderabad.',                 salary:14, market:'India',       status:'Screening', updated:'2026-06-03', notes:'Desired CTC submitted: 14 LPA. Auckland alumni — message them!' },
  { id:12, company:'Quest Global', title:'Power BI Engineer',                  desc:'Power BI development, DAX, stakeholder reporting, data modelling.',                                         salary:14, market:'India',       status:'Screening', updated:'2026-06-03', notes:'Screening form submitted. Awaiting result.' },
  { id:13, company:'Wise Group',   title:'Data Analyst',                       desc:'Power BI, DAX, SQL, data modelling, NGO health sector. Hamilton NZ hybrid.',                               salary:75, market:'New Zealand',  status:'Applied',   updated:'2026-06-03', notes:'URGENT — closes June 13. Email Liam Blackwell directly.' },
];

let jobs = [];
let nextId = 14;
let filter = 'All';

function load() {
  const saved = localStorage.getItem('vk_jobs');
  const savedId = localStorage.getItem('vk_nextId');
  if (saved) { jobs = JSON.parse(saved); nextId = parseInt(savedId) || 14; }
  else { jobs = DEFAULT_JOBS; nextId = 14; save(); }
}

function save() {
  localStorage.setItem('vk_jobs', JSON.stringify(jobs));
  localStorage.setItem('vk_nextId', nextId);
  const now = new Date();
  document.getElementById('last-saved').textContent = 'Last saved: ' + now.toLocaleTimeString();
  const toast = document.getElementById('toast');
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 1500);
}

function daysSince(dateStr) {
  const d = new Date(dateStr);
  const now = new Date();
  const diff = now - d;
  return Math.floor(diff / 86400000);
}

function avgSalary(market) {
  const rel = jobs.filter(j => j.market === market && j.salary > 0);
  if (!rel.length) return 0;
  return rel.reduce((s, j) => s + j.salary, 0) / rel.length;
}

function getPriority(job) {
  const avg = avgSalary(job.market);
  if (!avg || !job.salary) return 'Medium';
  if (job.salary >= avg * 1.3) return 'High';
  if (job.salary >= avg) return 'Medium';
  return 'Low';
}

function getStatus(job) {
  if (['Rejected','Offer Received','Screening','Interview Scheduled','No Response'].includes(job.status)) return job.status;
  if (job.status === 'Applied' && daysSince(job.updated) >= NO_RESP_DAYS) return 'No Response';
  return job.status;
}

function renderStats() {
  const total = jobs.length;
  const screening = jobs.filter(j => getStatus(j) === 'Screening').length;
  const interviews = jobs.filter(j => getStatus(j) === 'Interview Scheduled').length;
  const offers = jobs.filter(j => getStatus(j) === 'Offer Received').length;
  const followUp = jobs.filter(j => getStatus(j) === 'No Response').length;
  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="stat-label">Total applied</div><div class="stat-value">${total}</div></div>
    <div class="stat"><div class="stat-label">In screening</div><div class="stat-value">${screening}</div></div>
    <div class="stat"><div class="stat-label">Interviews</div><div class="stat-value">${interviews}</div></div>
    <div class="stat"><div class="stat-label">Offers</div><div class="stat-value" style="color:#3B6D11">${offers}</div></div>
    <div class="stat"><div class="stat-label">Follow up needed</div><div class="stat-value danger">${followUp}</div></div>
  `;
}

function renderTable() {
  const filtered = jobs.filter(j => {
    if (filter === 'All') return true;
    if (filter === 'India' || filter === 'New Zealand') return j.market === filter;
    if (filter === 'High') return getPriority(j) === 'High';
    if (filter === 'No Response') return getStatus(j) === 'No Response';
    if (filter === 'Screening') return getStatus(j) === 'Screening';
    if (filter === 'Interview Scheduled') return getStatus(j) === 'Interview Scheduled';
    return true;
  });

  const tbody = document.getElementById('tbody');
  const empty = document.getElementById('empty');

  if (!filtered.length) { tbody.innerHTML = ''; empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  tbody.innerHTML = filtered.map(j => {
    const priority = getPriority(j);
    const status = getStatus(j);
    const days = daysSince(j.updated);
    const daysText = days === 0 ? 'Today' : days === 1 ? '1 day ago' : `${days} days ago`;
    const isAlert = status === 'No Response';
    const salaryLabel = j.market === 'New Zealand' ? `NZD ${j.salary}K` : `${j.salary} LPA`;
    const pClass = priority === 'High' ? 'badge-high' : priority === 'Medium' ? 'badge-medium' : 'badge-low';
    const statusColors = { 'Applied':'#888', 'Screening':'#185FA5', 'Interview Scheduled':'#3B6D11', 'Offer Received':'#0F6E56', 'Rejected':'#A32D2D', 'No Response':'#E24B4A' };

    return `<tr>
      <td>
        <div class="company-name">${j.company}</div>
        <div class="role-name">${j.title}</div>
        <div class="role-desc">${j.desc}</div>
      </td>
      <td><span class="badge badge-market">${j.market}</span></td>
      <td><span class="salary-val">${salaryLabel}</span></td>
      <td><span class="badge ${pClass}">${priority}</span></td>
      <td>
        <select class="status-select" style="color:${statusColors[status]||'#888'}" onchange="updateStatus(${j.id},this.value)">
          ${STATUSES.map(s => `<option value="${s}" ${s===status?'selected':''}>${s}</option>`).join('')}
        </select>
      </td>
      <td>
        <div class="${isAlert?'days-warn':'days-ok'}">${daysText}</div>
        ${isAlert ? '<div class="follow-up"><i class="ti ti-bell" style="font-size:11px"></i> Follow up now</div>' : ''}
        <input type="date" class="date-input" value="${j.updated}" onchange="updateDate(${j.id},this.value)" />
      </td>
      <td><textarea class="notes-input" onblur="updateNotes(${j.id},this.value)">${j.notes}</textarea></td>
      <td><button class="del-btn" onclick="deleteJob(${j.id})" title="Delete"><i class="ti ti-trash"></i></button></td>
    </tr>`;
  }).join('');
}

function render() { renderStats(); renderTable(); }

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderTable();
}

function updateStatus(id, val) {
  const j = jobs.find(x => x.id === id);
  if (j) { j.status = val; j.updated = new Date().toISOString().split('T')[0]; save(); render(); }
}

function updateNotes(id, val) {
  const j = jobs.find(x => x.id === id);
  if (j) { j.notes = val; save(); }
}

function updateDate(id, val) {
  const j = jobs.find(x => x.id === id);
  if (j) { j.updated = val; save(); render(); }
}

function deleteJob(id) {
  if (!confirm('Remove this application from the tracker?')) return;
  jobs = jobs.filter(x => x.id !== id);
  save(); render();
}

function openModal() { document.getElementById('modal').classList.add('open'); document.getElementById('f-company').focus(); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }

function addJob() {
  const company = document.getElementById('f-company').value.trim();
  const title = document.getElementById('f-title').value.trim();
  if (!company || !title) { alert('Company name and job title are required.'); return; }
  const desc = document.getElementById('f-desc').value.trim();
  const salary = parseFloat(document.getElementById('f-salary').value) || 0;
  const market = document.getElementById('f-market').value;
  const notes = document.getElementById('f-notes').value.trim();
  jobs.push({ id: nextId++, company, title, desc, salary, market, status: 'Applied', updated: new Date().toISOString().split('T')[0], notes });
  closeModal();
  ['f-company','f-title','f-desc','f-salary','f-notes'].forEach(id => document.getElementById(id).value = '');
  save(); render();
}

document.getElementById('modal').addEventListener('click', e => { if (e.target === document.getElementById('modal')) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

load();
render();
</script>
</body>
</html>
